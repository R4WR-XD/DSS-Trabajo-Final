services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dss_educacion
      POSTGRES_USER: dss
      POSTGRES_PASSWORD: dss
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dss -d dss_educacion"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://dss:dss@db:5432/dss_educacion
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
